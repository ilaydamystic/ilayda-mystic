<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot by Ilayda</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, serif;
  background:
    radial-gradient(circle at 50% 10%, #51345f 0%, #24152e 45%, #100b16 100%);
  color: #f8edf8;
  text-align: center;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 35px 16px 50px;
}

h1 {
  font-size: 36px;
  margin: 5px 0 10px;
  letter-spacing: 1px;
}

.subtitle {
  color: #d9c5dc;
  max-width: 650px;
  margin: 0 auto 25px;
  line-height: 1.6;
}

.instruction {
  color: #ead9eb;
  font-size: 17px;
  margin-bottom: 25px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  max-width: 760px;
  margin: 0 auto;
}

.card {
  position: relative;
  height: 170px;
  border: 2px solid #b99a62;
  border-radius: 13px;
  cursor: pointer;
  overflow: hidden;
  color: #f6e7bd;
  background:
    radial-gradient(circle at center, rgba(190,154,98,.25) 0 2px, transparent 3px),
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.15) 0 1px, transparent 2px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,.15) 0 1px, transparent 2px),
    linear-gradient(145deg, #21142b, #452552 50%, #17101e);
  box-shadow:
    0 9px 22px rgba(0,0,0,.45),
    inset 0 0 0 3px rgba(185,154,98,.12);
  transition: transform .25s, box-shadow .25s;
}

.card::before {
  content: "✦";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(203,170,105,.65);
  border-radius: 9px;
  font-size: 54px;
  line-height: 145px;
  color: #c8a96a;
  text-shadow: 0 0 12px rgba(218,185,105,.5);
}

.card::after {
  content: "☾  ✧  ☽";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 15px;
  font-size: 14px;
  letter-spacing: 5px;
  color: #d2b676;
}

.card:hover {
  transform: translateY(-7px) scale(1.025);
  box-shadow:
    0 15px 30px rgba(0,0,0,.55),
    0 0 20px rgba(193,156,91,.22);
}

.card.selected {
  outline: 3px solid #e4c77e;
  transform: translateY(-7px);
}

.card.revealed {
  background:
    linear-gradient(145deg, #fffdf7, #eee3ef);
  color: #302236;
  border-color: #c6a86a;
}

.card.revealed::before,
.card.revealed::after {
  display: none;
}

.card-number {
  position: relative;
  z-index: 2;
  font-size: 14px;
  margin-top: 65px;
  opacity: .9;
}

.card-name {
  position: relative;
  z-index: 2;
  font-size: 16px;
  font-weight: bold;
  padding: 8px;
}

form {
  display: none;
  background: #fff;
  color: #302236;
  padding: 25px;
  border-radius: 18px;
  margin: 35px auto 0;
  max-width: 650px;
  text-align: left;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

form h2 {
  margin-top: 0;
  text-align: center;
}

#chosenCards {
  background: #f4ebf4;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.7;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d2c2d4;
  border-radius: 9px;
  font-family: inherit;
  font-size: 15px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

.submit {
  margin-top: 20px;
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #392441;
  color: white;
  font-size: 17px;
  font-family: Georgia, serif;
  cursor: pointer;
}

.submit:hover {
  background: #51345f;
}

.note {
  font-size: 13px;
  color: #cdbbd0;
  margin-top: 25px;
  line-height: 1.5;
}

form .note {
  color: #766878;
}

@media (max-width: 600px) {

  .container {
    padding: 25px 10px 40px;
  }

  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;
  }

  .cards {
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .card {
    height: 135px;
  }

  .card::before {
    inset: 6px;
    font-size: 40px;
    line-height: 112px;
  }

  .card::after {
    bottom: 10px;
    font-size: 10px;
    letter-spacing: 3px;
  }

  .card-number {
    margin-top: 52px;
    font-size: 11px;
  }

  .card-name {
    font-size: 13px;
  }

  form {
    padding: 20px 15px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🔮 Tarot by Ilayda</h1>

<p class="subtitle">
Take a deep breath, focus on your question,
and let your intuition guide you.
</p>

<p class="instruction">
<strong>Choose 3 cards from the deck</strong>
</p>

<div id="cards" class="cards"></div>

<form
  id="form"
  action="https://formspree.io/f/xwlkenzl"
  method="POST"
>

<h2>✨ Your Reading ✨</h2>

<p id="chosenCards"></p>

<input
  type="hidden"
  id="cardsInput"
  name="Selected Cards"
>

<label>Your Name</label>

<input
  name="Name"
  type="text"
  placeholder="Your name"
  required
>

<label>Your Email</label>

<input
  name="_replyto"
  type="email"
  placeholder="Your email address"
  required
>

<label>Your Question</label>

<textarea
  name="Question"
  placeholder="Example: What are his true feelings about me?"
  required
></textarea>

<button type="submit" class="submit">
Submit My Reading
</button>

</form>

<p class="note">
Tarot readings are intended for entertainment and personal reflection.
</p>

</div>

<script>

const tarotCards = [

"The Fool",
"The Magician",
"The High Priestess",
"The Empress",
"The Emperor",
"The Hierophant",
"The Lovers",
"The Chariot",
"Strength",
"The Hermit",
"Wheel of Fortune",
"Justice",
"The Hanged Man",
"Death",
"Temperance",
"The Devil",
"The Tower",
"The Star",
"The Moon",
"The Sun",
"Judgement",
"The World",

"Ace of Wands",
"Two of Wands",
"Three of Wands",
"Four of Wands",
"Five of Wands",
"Six of Wands",
"Seven of Wands",
"Eight of Wands",
"Nine of Wands",
"Ten of Wands",
"Page of Wands",
"Knight of Wands",
"Queen of Wands",
"King of Wands",

"Ace of Cups",
"Two of Cups",
"Three of Cups",
"Four of Cups",
"Five of Cups",
"Six of Cups",
"Seven of Cups",
"Eight of Cups",
"Nine of Cups",
"Ten of Cups",
"Page of Cups",
"Knight of Cups",
"Queen of Cups",
"King of Cups",

"Ace of Swords",
"Two of Swords",
"Three of Swords",
"Four of Swords",
"Five of Swords",
"Six of Swords",
"Seven of Swords",
"Eight of Swords",
"Nine of Swords",
"Ten of Swords",
"Page of Swords",
"Knight of Swords",
"Queen of Swords",
"King of Swords",

"Ace of Pentacles",
"Two of Pentacles",
"Three of Pentacles",
"Four of Pentacles",
"Five of Pentacles",
"Six of Pentacles",
"Seven of Pentacles",
"Eight of Pentacles",
"Nine of Pentacles",
"Ten of Pentacles",
"Page of Pentacles",
"Knight of Pentacles",
"Queen of Pentacles",
"King of Pentacles"

];

let shuffled = [...tarotCards]
  .sort(() => Math.random() - 0.5)
  .slice(0, 24);

let selected = [];

const cardsContainer =
  document.getElementById("cards");

shuffled.forEach((cardName, index) => {

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "card";

  button.innerHTML =
    '<div class="card-number">CARD ' +
    (index + 1) +
    '</div>';

  button.onclick = function() {

    if (
      button.classList.contains("selected")
    ) {
      return;
    }

    if (selected.length >= 3) {
      return;
    }

    selected.push(cardName);

    button.classList.add("selected");

    if (selected.length === 3) {

      document
        .querySelectorAll(".card")
        .forEach(card => {
          card.disabled = true;
        });

      setTimeout(() => {

        document
          .querySelectorAll(".card")
          .forEach((card, i) => {

            if (
              selected.includes(shuffled[i])
            ) {

              card.classList.add("revealed");

              card.innerHTML =
                '<div class="card-name">' +
                shuffled[i] +
                '</div>';

            }

          });

        document.getElementById(
          "chosenCards"
        ).innerHTML =
          "<strong>Your cards:</strong><br>" +
          selected.join("<br>");

        document.getElementById(
          "cardsInput"
        ).value =
          selected.join(", ");

        document.getElementById(
          "form"
        ).style.display = "block";

        document.getElementById(
          "form"
        ).scrollIntoView({
          behavior: "smooth"
        });

      }, 600);
    }
  };

  cardsContainer.appendChild(button);

});

</script>

</body>
</html>
